<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      html[data-theme-boot] { --boot-bg: #f7f7f7; }
      html.dark[data-theme-boot] { --boot-bg: #0f172a; }
      html[data-theme-boot] body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: var(--boot-bg);
        opacity: 1;
        pointer-events: none;
        transition: opacity 240ms ease-out;
      }
      html[data-theme-boot='done'] body::after { opacity: 0; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var prefs = JSON.parse(localStorage.getItem('leitor_md_preferences') || '{}');
          var isDark = prefs.theme === 'dark';
          root.classList.toggle('dark', isDark);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', isDark ? '#0f172a' : '#ffffff');
        } catch (err) {
          console.warn('Falha ao aplicar o tema antes do primeiro paint:', err);
        }
        try {
          if (sessionStorage.getItem('leitor_md_theme_reload_snapshot_v1') !== null) {
            root.setAttribute('data-theme-boot', '');
            setTimeout(function () { root.removeAttribute('data-theme-boot'); }, 3000);
          }
        } catch (err) {
          console.warn('Falha ao preparar a cobertura de boot:', err);
        }
      })();
    </script>
    <meta name="description" content="Leitor e Editor de Markdown PWA para leitura, grifos e edição com suporte ao OneDrive." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Leitor MD" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <title>Leitor & Editor Markdown PWA</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
